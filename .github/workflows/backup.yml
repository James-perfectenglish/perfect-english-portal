name: Weekly DB Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install postgresql-client-17
        run: |
          sudo apt-get install -y gnupg curl
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Run backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p backups
          echo "Backing up question_bank..."
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --table=question_bank \
            --data-only \
            --column-inserts \
            --no-password \
            > backups/question_bank_${DATE}.sql
          echo "Backing up student_answers..."
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --table=student_answers \
            --data-only \
            --column-inserts \
            --no-password \
            > backups/student_answers_${DATE}.sql
          echo "Backup complete."
          ls -lh backups/

      - name: Commit backups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "chore: weekly DB backup $(date +%Y-%m-%d)"
          git push
