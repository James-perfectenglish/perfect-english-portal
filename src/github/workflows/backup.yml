name: Weekly DB Backup

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Run backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p backups

          echo "Backing up question_bank..."
          pg_dump "$DB_URL" \
            --table=question_bank \
            --data-only \
            --column-inserts \
            --no-password \
            > backups/question_bank_${DATE}.sql

          echo "Backing up student_answers..."
          pg_dump "$DB_URL" \
            --table=student_answers \
            --data-only \
            --column-inserts \
            --no-password \
            > backups/student_answers_${DATE}.sql

          echo "Backup complete."
          ls -lh backups/

      - name: Commit backups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "chore: weekly DB backup $(date +%Y-%m-%d)"
          git push